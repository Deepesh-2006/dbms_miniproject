<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>.t{font:700 16px Arial;fill:#fff}.c{font:12px Arial;fill:#223}.b{fill:#f8fafc;stroke:#1a936f;stroke-width:2}.h{fill:#1a936f}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}.r{font:11px Arial;fill:#64748b}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#64748b"/></marker></defs>
<g class="l"><path d="M250 160H360"/><path d="M250 430H360"/><path d="M580 160H720"/><path d="M580 430H720"/><path d="M970 160H1080"/><path d="M970 430H1080"/><path d="M1250 430V700H1180"/><path d="M830 510V700"/><path d="M500 510V700"/><path d="M250 780H360"/><path d="M970 780H1080"/></g>
<g><rect class="b" x="50" y="70" width="200" height="120" rx="8"/><rect class="h" x="50" y="70" width="200" height="32" rx="8"/><text class="t" x="65" y="92">manufacturers</text><text class="c" x="65" y="122">PK manufacturer_id</text><text class="c" x="65" y="142">name (UNIQUE)</text><text class="c" x="65" y="162">country</text>
<rect class="b" x="360" y="70" width="220" height="120" rx="8"/><rect class="h" x="360" y="70" width="220" height="32" rx="8"/><text class="t" x="375" y="92">vehicle_types</text><text class="c" x="375" y="122">PK vehicle_type_id</text><text class="c" x="375" y="142">FK manufacturer_id</text><text class="c" x="375" y="162">name, category, expected_kmpl</text>
<rect class="b" x="720" y="70" width="250" height="120" rx="8"/><rect class="h" x="720" y="70" width="250" height="32" rx="8"/><text class="t" x="735" y="92">vehicles</text><text class="c" x="735" y="122">PK vehicle_id · registration (UQ)</text><text class="c" x="735" y="142">FK vehicle_type_id, branch_id</text><text class="c" x="735" y="162">odometer, service schedule, status</text>
<rect class="b" x="1080" y="70" width="200" height="120" rx="8"/><rect class="h" x="1080" y="70" width="200" height="32" rx="8"/><text class="t" x="1095" y="92">insurance</text><text class="c" x="1095" y="122">PK insurance_id</text><text class="c" x="1095" y="142">FK vehicle_id</text><text class="c" x="1095" y="162">policy, dates, premium</text>
<rect class="b" x="50" y="340" width="200" height="120" rx="8"/><rect class="h" x="50" y="340" width="200" height="32" rx="8"/><text class="t" x="65" y="362">branches</text><text class="c" x="65" y="392">PK branch_id</text><text class="c" x="65" y="412">name (UNIQUE)</text><text class="c" x="65" y="432">city, state</text>
<rect class="b" x="360" y="340" width="220" height="120" rx="8"/><rect class="h" x="360" y="340" width="220" height="32" rx="8"/><text class="t" x="375" y="362">drivers</text><text class="c" x="375" y="392">PK driver_id</text><text class="c" x="375" y="412">FK branch_id</text><text class="c" x="375" y="432">license (UQ), status</text>
<rect class="b" x="720" y="340" width="250" height="170" rx="8"/><rect class="h" x="720" y="340" width="250" height="32" rx="8"/><text class="t" x="735" y="362">trips</text><text class="c" x="735" y="392">PK trip_id</text><text class="c" x="735" y="412">FK vehicle_id, driver_id, route_id</text><text class="c" x="735" y="432">time, start/end odometer</text><text class="c" x="735" y="452">status, derived distance</text><text class="c" x="735" y="482">Insurance trigger validates trip</text>
<rect class="b" x="1080" y="340" width="200" height="120" rx="8"/><rect class="h" x="1080" y="340" width="200" height="32" rx="8"/><text class="t" x="1095" y="362">routes</text><text class="c" x="1095" y="392">PK route_id</text><text class="c" x="1095" y="412">origin, destination</text><text class="c" x="1095" y="432">planned distance</text>
<rect class="b" x="360" y="700" width="240" height="150" rx="8"/><rect class="h" x="360" y="700" width="240" height="32" rx="8"/><text class="t" x="375" y="722">fuel_transactions</text><text class="c" x="375" y="752">PK fuel_transaction_id</text><text class="c" x="375" y="772">FK vehicle_id, driver_id</text><text class="c" x="375" y="792">litres × rate = total cost</text><text class="c" x="375" y="822">Odometer validation trigger</text>
<rect class="b" x="720" y="700" width="240" height="150" rx="8"/><rect class="h" x="720" y="700" width="240" height="32" rx="8"/><text class="t" x="735" y="722">maintenance</text><text class="c" x="735" y="752">PK maintenance_id</text><text class="c" x="735" y="772">FK vehicle, type, center</text><text class="c" x="735" y="792">date, odometer, cost</text><text class="c" x="735" y="822">Service schedule update trigger</text>
<rect class="b" x="1080" y="700" width="220" height="150" rx="8"/><rect class="h" x="1080" y="700" width="220" height="32" rx="8"/><text class="t" x="1095" y="722">accidents / expenses</text><text class="c" x="1095" y="752">PK accident_id / expense_id</text><text class="c" x="1095" y="772">FK vehicle_id (+ driver)</text><text class="c" x="1095" y="792">severity, damage / category</text><text class="c" x="1095" y="822">date, amount, description</text>
</g><text class="r" x="50" y="930">Arrow = parent 1 → child many. vehicle_assignments links vehicles and drivers with PostgreSQL exclusion constraints that prevent overlaps.</text></svg>
